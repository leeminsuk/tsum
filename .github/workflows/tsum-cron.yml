name: tsum-cron

# Vercel Hobby 크론은 일 1회 제한 — 5시간 주기 분석은 여기서 트리거한다
# 분석은 서버에서 수 분 걸림 → 응답을 끝까지 기다리지 않는 fire-and-forget:
# Vercel 함수는 클라이언트가 끊겨도 maxDuration까지 계속 실행되므로 20초 안에
# 트리거 성사(연결·인증)만 확인한다. 과거 -m 280 대기 방식은 매번 exit 28로 실패했다.
on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger TSUM analysis (fire-and-forget)
        run: |
          set +e
          code=$(curl -sS -o /dev/null -w "%{http_code}" -m 20 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://tsum-eight.vercel.app/api/cron)
          rc=$?
          set -e
          if [ "$rc" = "28" ]; then echo "20s 내 응답 없음 = 분석 시작됨 (fire-and-forget OK)"; exit 0; fi
          if [ "$rc" != "0" ]; then echo "curl 실패 rc=$rc"; exit "$rc"; fi
          case "$code" in
            2*) echo "HTTP $code — 즉시 완료" ;;
            401|403) echo "인증 실패 HTTP $code — CRON_SECRET 확인 필요"; exit 1 ;;
            *) echo "HTTP $code"; exit 1 ;;
          esac
