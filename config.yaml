agent:
  name: Crypto Intelligence Agent
  default_coin: bitcoin
  default_hours: 24
  min_whale_usd: 1000000
  mock_when_no_key: true
  request_timeout_sec: 15

sentiment:
  # ── 모델 경로 설정 ────────────────────────────────────────────────────────
  # Llama-3 QLoRA 파인튜닝 모델을 사용하려면:
  #   1. Google Colab에서 finetune_llama3.ipynb 실행 후 zip 다운로드
  #   2. models/finetuned_llama3/ 폴더에 압축 해제
  #   3. model_path를 아래로 변경
  # model_path: ./models/finetuned_llama3
  #
  # 기존 CryptoBERT 파인튜닝 모델:
  # model_path: ./models/finetuned_cryptobert
  #
  # 경로에 adapter_config.json이 있으면 자동으로 PEFT(LoRA) 모드로 로드됩니다.
  model_path: ./models/finetuned_llama3
  base_model: meta-llama/Meta-Llama-3-8B-Instruct
  fallback_base_model: ElKulako/cryptobert
  labels:
    0: bearish
    1: neutral
    2: bullish
  bullish_threshold: 0.58
  bearish_threshold: 0.42

signal_engine:
  weights:
    sentiment: 0.35
    fear_greed: 0.15
    whale: 0.20
    exchange_flow: 0.20
    defi: 0.10
  buy_threshold: 0.62
  sell_threshold: 0.38
  conflict_penalty: 0.12
  high_confidence_threshold: 0.72

coins:
  bitcoin:
    coingecko_id: bitcoin
    symbol: BTC
    chain: bitcoin
  ethereum:
    coingecko_id: ethereum
    symbol: ETH
    chain: ethereum
    contract: ""
  solana:
    coingecko_id: solana
    symbol: SOL
    chain: solana
  dogecoin:
    coingecko_id: dogecoin
    symbol: DOGE
    chain: dogecoin
