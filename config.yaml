agent:
  name: Crypto Intelligence Agent
  default_coin: bitcoin
  default_hours: 24
  min_whale_usd: 1000000
  mock_when_no_key: true
  request_timeout_sec: 15

sentiment:
  # ── 모델 경로 설정 ────────────────────────────────────────────────────────
  # Qwen2.5-14B unsloth 파인튜닝 모델 (generation 방식):
  #   1. Kaggle 2xT4에서 finetune_llama3.ipynb 실행 후 zip 다운로드
  #   2. models/finetuned_qwen25/ 폴더에 압축 해제
  #   3. model_path를 아래로 변경
  # model_path: ./models/finetuned_qwen25
  #
  # 커스텀 데이터 파인튜닝 결과물 (finetune_cryptobert.ipynb):
  # model_path: ./models/finetuned_qwen25_custom
  #
  # ※ adapter_config.json이 있으면 PEFT(LoRA) generation 모드로 자동 로드
  # ※ 모델 없으면 룰 기반 fallback 자동 동작
  model_path: ./models/finetuned_qwen25
  base_model: unsloth/Qwen2.5-14B-bnb-4bit
  fallback_base_model: ElKulako/cryptobert
  # generation 방식 설정
  generation:
    max_new_tokens: 5
    do_sample: false
    system_prompt: >
      You are a crypto market sentiment analyzer.
      Classify the sentiment of the given text as exactly one of:
      bearish, neutral, bullish. Reply with only the label word.
  labels:
    0: bearish
    1: neutral
    2: bullish
  bullish_threshold: 0.58
  bearish_threshold: 0.42

signal_engine:
  weights:
    sentiment: 0.35
    fear_greed: 0.15
    whale: 0.20
    exchange_flow: 0.20
    defi: 0.10
  buy_threshold: 0.62
  sell_threshold: 0.38
  conflict_penalty: 0.12
  high_confidence_threshold: 0.72

coins:
  bitcoin:
    coingecko_id: bitcoin
    symbol: BTC
    chain: bitcoin
  ethereum:
    coingecko_id: ethereum
    symbol: ETH
    chain: ethereum
    contract: ""
  solana:
    coingecko_id: solana
    symbol: SOL
    chain: solana
  dogecoin:
    coingecko_id: dogecoin
    symbol: DOGE
    chain: dogecoin
